<rect x="838" y="294.4" width="330" height="79" rx="12" fill="#FFF5E3" stroke="#F1CF93" stroke-width="1"/>
<rect x="32" y="439.4" width="766" height="89" rx="12" fill="#FBEFE6" stroke="#9A4A17" stroke-width="1.4"/>
<rect x="32" y="447.4" width="4" height="73" rx="2" fill="#9A4A17"/>
<rect x="838" y="439.4" width="330" height="79" rx="12" fill="#FFF5E3" stroke="#F1CF93" stroke-width="1"/>
<rect x="32" y="584.4" width="766" height="89" rx="12" fill="#FBEFE6" stroke="#9A4A17" stroke-width="1.4"/>
<rect x="32" y="592.4" width="4" height="73" rx="2" fill="#9A4A17"/>
<rect x="838" y="584.4" width="330" height="79" rx="12" fill="#FFF5E3" stroke="#F1CF93" stroke-width="1"/>
<rect x="32" y="729.4" width="766" height="89" rx="12" fill="#FBEFE6" stroke="#9A4A17" stroke-width="1.4"/>
<rect x="32" y="737.4" width="4" height="73" rx="2" fill="#9A4A17"/>
<rect x="838" y="729.4" width="330" height="79" rx="12" fill="#FFF5E3" stroke="#F1CF93" stroke-width="1"/>
<rect x="32" y="874.4" width="766" height="89" rx="12" fill="#E6F6F4" stroke="#0B7A72" stroke-width="1.4"/>
<rect x="32" y="882.4" width="4" height="73" rx="2" fill="#0B7A72"/>
<text x="56" y="184.4" font-size="20" font-weight="700" fill="#7A360E">1  Mean code</text>
<text x="56" y="215" font-size="17" fill="#2B3442">sample_count conversions; the mean, rounded</text>
<text x="856" y="184.4" font-size="20" font-weight="700" fill="#8A3C0B">Can end with</text>
<text x="856" y="207.8" font-size="17" fill="#8A3C0B">Bus, CodeOutOfScale, Unstable</text>
<text x="56" y="329.4" font-size="20" font-weight="700" fill="#7A360E">2  Classify the code</text>
<text x="56" y="360" font-size="17" fill="#2B3442">the rails: margins at open and at short</text>
<text x="856" y="329.4" font-size="20" font-weight="700" fill="#8A3C0B">Can end with</text>
<text x="856" y="352.8" font-size="17" fill="#8A3C0B">OpenCircuit, ShortCircuit</text>
<text x="56" y="474.4" font-size="20" font-weight="700" fill="#7A360E">3  Divider to resistance</text>
<text x="56" y="505" font-size="17" fill="#2B3442">node ratio and the series resistor, in 1/256 ohm</text>
<text x="856" y="474.4" font-size="20" font-weight="700" fill="#8A3C0B">Can end with</text>
<text x="856" y="497.8" font-size="17" fill="#8A3C0B">BelowRange (more than 32 bits)</text>
<text x="56" y="619.4" font-size="20" font-weight="700" fill="#7A360E">4  Curve</text>
<text x="56" y="650" font-size="17" fill="#2B3442">table, Steinhart-Hart (cubic in ln R) or beta: 1/T in Q32</text>
<text x="856" y="619.4" font-size="20" font-weight="700" fill="#8A3C0B">Can end with</text>
<text x="856" y="642.8" font-size="17" fill="#8A3C0B">BelowRange, AboveRange</text>
<text x="56" y="764.4" font-size="20" font-weight="700" fill="#7A360E">5  Window and offset</text>
<text x="56" y="795" font-size="17" fill="#2B3442">inside the window, then the offset</text>
<text x="856" y="764.4" font-size="20" font-weight="700" fill="#8A3C0B">Can end with</text>
<text x="856" y="787.9" font-size="17" fill="#8A3C0B">BelowRange, AboveRange</text>
<text x="56" y="909.4" font-size="20" font-weight="700" fill="#0B5F59">6  Reading</text>
<text x="56" y="940" font-size="17" fill="#2B3442">temperature_mc, resistance_ohm, code, uncertainty_mc</text>
<rect x="32" y="975.8" width="14" height="14" rx="4" fill="#FBEFE6" stroke="#9A4A17" stroke-width="1.4"/>
<text x="54" y="990.4" font-size="16" fill="#566070">stage</text>
<rect x="122.3" y="975.8" width="14" height="14" rx="4" fill="#FFF5E3" stroke="#C26A05" stroke-width="1.4"/>
<text x="144.3" y="990.4" font-size="16" fill="#566070">ends the read with an error</text>
<rect x="385.4" y="975.8" width="14" height="14" rx="4" fill="#E6F6F4" stroke="#0B7A72" stroke-width="1.4"/>
<text x="407.4" y="990.4" font-size="16" fill="#566070">result</text>
</svg>
