<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1026" viewBox="0 0 1200 1026" role="img" aria-labelledby="conversion-pipeline-title conversion-pipeline-desc" font-family="Inter, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif">
<title id="conversion-pipeline-title">From an ADC code to a temperature</title>
<desc id="conversion-pipeline-desc">Pipeline of six stages: the mean of the samples, the classification of the code as open circuit, short circuit or out of scale, the divider's node ratio giving the resistance, the curve (table, Steinhart-Hart or beta) giving the temperature, the window and offset, and the uncertainty bound.</desc>
<defs><marker id="fk-arrow-rail" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#8893A2"/></marker></defs>
<rect x="0.5" y="0.5" width="1199" height="1025" rx="16" fill="#FFFFFF" stroke="#E2E7EE"/>
<text x="32" y="46.8" font-size="16" font-weight="700" letter-spacing="1.2" fill="#7A360E">ARCHITECTURE</text>
<text x="32" y="85.6" font-size="32" font-weight="700" fill="#0E1726">From an ADC code to a temperature</text>
<text x="32" y="115.4" font-size="18" fill="#566070">Integers only: ohms, milli-degrees, millivolts. Each stage can end the read with its own error.</text>
<rect x="32" y="131.4" width="1136" height="1" fill="#E2E7EE"/>
<path d="M415 242.4 L415 290.4" fill="none" stroke="#8893A2" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#fk-arrow-rail)"/>
<path d="M415 387.4 L415 435.4" fill="none" stroke="#8893A2" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#fk-arrow-rail)"/>
<path d="M415 532.4 L415 580.4" fill="none" stroke="#8893A2" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#fk-arrow-rail)"/>
<path d="M415 677.4 L415 725.4" fill="none" stroke="#8893A2" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#fk-arrow-rail)"/>
<path d="M415 822.4 L415 870.4" fill="none" stroke="#8893A2" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#fk-arrow-rail)"/>
<rect x="32" y="149.4" width="766" height="89" rx="12" fill="#FBEFE6" stroke="#9A4A17" stroke-width="1.4"/>
<rect x="32" y="157.4" width="4" height="73" rx="2" fill="#9A4A17"/>
<rect x="838" y="149.4" width="330" height="79" rx="12" fill="#FFF5E3" stroke="#F1CF93" stroke-width="1"/>
