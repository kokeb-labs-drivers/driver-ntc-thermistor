<svg xmlns="http://www.w3.org/2000/svg" width="840" height="463" viewBox="0 0 840 463" role="img" aria-labelledby="chip-circuit-divider-high-title chip-circuit-divider-high-desc" font-family="Inter, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif">
<title id="chip-circuit-divider-high-title">NTC thermistor (generic): High-side divider</title>
<desc id="chip-circuit-divider-high-desc">Schematic of the NTC thermistor (generic) high-side divider: the chip with U2 MCU, R1 resistor 10 kΩ, C1 capacitor 100 nF; the MCU wires carry the port hooks ReadRaw().</desc>
<rect x="0.5" y="0.5" width="839" height="462" rx="16" fill="#FFFFFF" stroke="#E2E7EE"/>
<text x="32" y="44" font-size="12.5" font-weight="700" letter-spacing="1.2" fill="#7A360E">HARDWARE</text>
<text x="32" y="77.3" font-size="26" font-weight="700" fill="#0E1726">NTC thermistor (generic): High-side divider</text>
<text x="32" y="103.8" font-size="15" fill="#566070">The thermistor between the supply and the ADC input, the series resistor to ground: the node rises as</text>
<text x="32" y="125.5" font-size="15" fill="#566070">the thermistor heats. Set Config::topology to NtcHighSide. Above each MCU wire: the port hook that</text>
<text x="32" y="147.3" font-size="15" fill="#566070">drives it. Datasheet: Divider, V = V_s R_n / (R_s + R_n), p. 1.</text>
<rect x="32" y="163.3" width="776" height="1" fill="#E2E7EE"/>
