<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="634" viewBox="0 0 1200 634" role="img" aria-labelledby="chip-wiring-divider-title chip-wiring-divider-desc" font-family="Inter, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif">
<title id="chip-wiring-divider-title">Wiring: Low-side divider</title>
<desc id="chip-wiring-divider-desc">Wiring of the NTC thermistor (generic) for the Low-side divider: MCU ADC input to T1 (ReadRaw()). Supplies, grounds and the support parts are listed under the drawing.</desc>
<rect x="0.5" y="0.5" width="1199" height="633" rx="16" fill="#FFFFFF" stroke="#E2E7EE"/>
<text x="32" y="46.8" font-size="16" font-weight="700" letter-spacing="1.2" fill="#7A360E">PINS AND WIRING</text>
<text x="32" y="85.6" font-size="32" font-weight="700" fill="#0E1726">Wiring: Low-side divider</text>
<text x="32" y="115.4" font-size="18" fill="#566070">What you connect by hand, with the driver hook on each MCU wire. The full schematic, with every part and value, is on the</text>
<text x="32" y="141.5" font-size="18" fill="#566070">Hardware page. Datasheet: Divider, V = V_s R_n / (R_s + R_n), p. 1.</text>
<rect x="32" y="157.5" width="1136" height="1" fill="#E2E7EE"/>
<path d="M453.2 280.3 L692.8 280.3" fill="none" stroke="#A21CAF" stroke-width="2.2"/>
<rect x="706.8" y="175.5" width="240" height="165.6" rx="10" fill="#F5F7FA" stroke="#2B3442" stroke-width="2.2"/>
<rect x="253.2" y="175.5" width="200" height="165.6" rx="12" fill="#EAF2FF" stroke="#2563EB" stroke-width="1.4"/>
<rect x="32" y="369.1" width="1136" height="79" rx="12" fill="#FFEEF2" stroke="#F5BECB" stroke-width="1"/>
<rect x="32" y="462.1" width="1136" height="79" rx="12" fill="#F1F4F8" stroke="#CBD5E1" stroke-width="1"/>
<text x="826.8" y="210.5" font-size="20" font-weight="700" text-anchor="middle" fill="#0E1726">NTC thermistor (generic)</text>
<text x="826.8" y="232.9" font-size="16" text-anchor="middle" fill="#566070">U1</text>
<text x="271.2" y="210.5" font-size="20" font-weight="700" fill="#1E429F">MCU</text>
<text x="271.2" y="232.9" font-size="16" fill="#1E429F">U2</text>
<text x="435.2" y="286.1" font-size="16" font-weight="600" font-family="'JetBrains Mono', 'SFMono-Regular', Menlo, Consolas, monospace" text-anchor="end" fill="#1E429F">ADC input</text>
<text x="728.8" y="286.1" font-size="16" font-weight="700" font-family="'JetBrains Mono', 'SFMono-Regular', Menlo, Consolas, monospace" fill="#0E1726">T1</text>
<rect x="692.8" y="274.3" width="14" height="12" rx="2" fill="#FDF0FF" stroke="#A21CAF" stroke-width="1.4"/>
<text x="573" y="270.3" font-size="16" font-weight="600" text-anchor="middle" fill="#2B3442">NODE  pin 1</text>
<text x="573" y="303.1" font-size="16" font-family="'JetBrains Mono', 'SFMono-Regular', Menlo, Consolas, monospace" text-anchor="middle" fill="#566070">ReadRaw()</text>
<text x="573" y="324.7" font-size="16" font-family="'JetBrains Mono', 'SFMono-Regular', Menlo, Consolas, monospace" text-anchor="middle" fill="#566070">+ R1 10 kΩ, C1 100 nF</text>
<text x="50" y="404.1" font-size="20" font-weight="700" fill="#9F1239">Supplies and ground</text>
<text x="50" y="427.5" font-size="17" fill="#9F1239">+3V3: ; also U2.VREF · GND: T2; also U2.GND</text>
<text x="50" y="497.1" font-size="20" font-weight="700" fill="#334155">Also on the board</text>
<text x="50" y="520.5" font-size="17" fill="#334155">Support parts: 1 capacitor, 1 resistor around the supplies (values in the full schematic).</text>
<text x="32" y="566.6" font-size="16" fill="#566070">* Not confirmed in the datasheet: R1: example value: pick R1 with the rule on the Hardware page; C1: example value, optional filter.</text>
<rect x="32" y="583.8" width="14" height="14" rx="4" fill="#FDF0FF" stroke="#A21CAF" stroke-width="1.4"/>
<text x="54" y="598.4" font-size="16" fill="#566070">analog</text>
</svg>
