<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="900" viewBox="0 0 1200 900" role="img" aria-labelledby="chip-capabilities-title chip-capabilities-desc" font-family="Inter, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif">
<title id="chip-capabilities-title">What the NTC thermistor (generic) does</title>
<desc id="chip-capabilities-desc">Capability map of the NTC thermistor (generic): Voltage divider (supported): Turns the voltage at the divider node into the thermistor's resistance, thermistor low side or high side; Beta equation (supported): Temperature from R25 and B (B25/85 by default), in fixed point, inside the rated window you declare; Steinhart-Hart (supported): Temperature from the three Steinhart-Hart coefficients, in integers; Resistance table (supported): Temperature from a table of resistance and temperature rows, interpolated in ln R; any part is data; Open, short and range faults (supported): Names a cut wire, a short, a part outside its window, noisy samples and an ADC that disagrees; Reading uncertainty (supported): Bounds every reading from the tolerances you declare and one converter step; Self-heating (supported): Estimates the power the divider dissipates in the thermistor, to size the series resistor; Switched bias (supported): Switches the divider supply from an MCU pin and waits for it to settle, to cut current and self-heating.</desc>
