<svg xmlns="http://www.w3.org/2000/svg" width="760" height="485" viewBox="0 0 760 485" role="img" aria-labelledby="chip-pinout-title chip-pinout-desc" font-family="Inter, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif">
<title id="chip-pinout-title">NTC thermistor (generic) pinout, 0603</title>
<desc id="chip-pinout-desc">Pinout of the NTC thermistor (generic) in 0603, top view: 2 pins, each with its name, its electrical type as a colour and the driver hook that uses it.</desc>
<rect x="0.5" y="0.5" width="759" height="484" rx="16" fill="#0E131A" stroke="#283241"/>
<text x="32" y="44" font-size="12.5" font-weight="700" letter-spacing="1.2" fill="#F8D27A">HARDWARE</text>
<text x="32" y="77.3" font-size="26" font-weight="700" fill="#E8EDF3">NTC thermistor (generic) pinout, 0603</text>
<text x="32" y="103.8" font-size="15" fill="#9AA6B5">Top view, pin 1 marked. Colour is the pin's electrical type; the mono text outside is the port</text>
<text x="32" y="125.5" font-size="15" fill="#9AA6B5">hook the driver uses for it. Datasheet: Chip and bead NTC families (typical sizes), p. 1.</text>
<rect x="32" y="141.6" width="696" height="1" fill="#252F3C"/>
<rect x="250" y="179.6" width="260" height="200" rx="8" fill="#18202B" stroke="#D2DAE4" stroke-width="2"/>
<path d="M364 179.6 A16 16 0 0 0 396 179.6" fill="#151C26" stroke="#D2DAE4" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
<circle cx="270" cy="199.6" r="6" fill="#D2DAE4"/>
<rect x="220" y="269.6" width="30" height="20" rx="3" fill="#2E1533" stroke="#F0ABFC" stroke-width="1.4"/>
<rect x="510" y="269.6" width="30" height="20" rx="3" fill="#2E1533" stroke="#F0ABFC" stroke-width="1.4"/>
<text x="380" y="269.6" font-size="20" font-weight="700" text-anchor="middle" fill="#E8EDF3">NTC thermistor (generic)</text>
<text x="380" y="293.6" font-size="13" text-anchor="middle" fill="#9AA6B5">0603, top view</text>
<text x="235" y="283.7" font-size="11.5" font-weight="700" text-anchor="middle" fill="#F5D0FE">1</text>
<text x="210" y="284.6" font-size="14" font-weight="700" font-family="'JetBrains Mono', 'SFMono-Regular', Menlo, Consolas, monospace" text-anchor="end" fill="#E8EDF3">T1*</text>
<text x="165.3" y="283.9" font-size="12" font-family="'JetBrains Mono', 'SFMono-Regular', Menlo, Consolas, monospace" text-anchor="end" fill="#9AA6B5">ReadRaw()</text>
<text x="525" y="283.7" font-size="11.5" font-weight="700" text-anchor="middle" fill="#F5D0FE">2</text>
<text x="550" y="284.6" font-size="14" font-weight="700" font-family="'JetBrains Mono', 'SFMono-Regular', Menlo, Consolas, monospace" fill="#E8EDF3">T2*</text>
<text x="32" y="401.6" font-size="12.5" fill="#9AA6B5">* Not confirmed in the datasheet: pin 1 T1: not polarised; T1 and T2 are this driver's names; pin 2 T2: not</text>
<text x="32" y="419.6" font-size="12.5" fill="#9AA6B5">polarised; T1 and T2 are this driver's names.</text>
<rect x="32" y="438.7" width="14" height="14" rx="4" fill="#2E1533" stroke="#F0ABFC" stroke-width="1.4"/>
<text x="54" y="450.3" font-size="12.5" fill="#9AA6B5">analog</text>
</svg>
