<svg xmlns="http://www.w3.org/2000/svg" width="888" height="493" viewBox="0 0 888 493" role="img" aria-labelledby="chip-circuit-divider-title chip-circuit-divider-desc" font-family="Inter, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif">
<title id="chip-circuit-divider-title">NTC thermistor (generic): Low-side divider</title>
<desc id="chip-circuit-divider-desc">Schematic of the NTC thermistor (generic) low-side divider: the chip with U2 MCU, R1 resistor 10 kΩ, C1 capacitor 100 nF; the MCU wires carry the port hooks ReadRaw().</desc>
<rect x="0.5" y="0.5" width="887" height="492" rx="16" fill="#0E131A" stroke="#283241"/>
<text x="32" y="44" font-size="12.5" font-weight="700" letter-spacing="1.2" fill="#F8D27A">HARDWARE</text>
<text x="32" y="77.3" font-size="26" font-weight="700" fill="#E8EDF3">NTC thermistor (generic): Low-side divider</text>
<text x="32" y="103.8" font-size="15" fill="#9AA6B5">The thermistor between the ADC input and ground, a series resistor to the supply that is also the ADC</text>
<text x="32" y="125.5" font-size="15" fill="#9AA6B5">reference. The driver reads the node with ReadRaw(); the optional capacitor filters the node. Above each</text>
<text x="32" y="147.3" font-size="15" fill="#9AA6B5">MCU wire: the port hook that drives it. Datasheet: Divider, V = V_s R_n / (R_s + R_n), p. 1.</text>
