<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="849" viewBox="0 0 1200 849" role="img" aria-labelledby="chip-hero-title chip-hero-desc" font-family="Inter, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif">
<title id="chip-hero-title">NTC thermistor (generic)</title>
<desc id="chip-hero-desc">Overview of the NTC thermistor (generic), a resistor whose resistance falls as it heats: with a series resistor it makes a voltage divider an ADC can read, and a curve (a table, Steinhart-Hart coefficients, or R25 and B) turns the resistance into a temperature. A MCU talks to it over ADC input; it reads back Temperature. Headline figures: 10 kΩ resistance at 25 °C, ±1 % (the example part); 3435 K B value at 25/85 °C, ±1 % (the example part); -40 to 150 °C operating temperature (the example part); 0.31 mA permissive operating current at 25 °C (the example part).</desc>
