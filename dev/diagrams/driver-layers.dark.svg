<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="935" viewBox="0 0 1200 935" role="img" aria-labelledby="driver-layers-title driver-layers-desc" font-family="Inter, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif">
<title id="driver-layers-title">The layers, one of them yours</title>
<desc id="driver-layers-desc">Layer diagram: your application calls the NtcThermistor core, which asks for ADC conversions through the ADC port contract to the port class you write, which reads the divider; the core and the contract are the same on every MCU.</desc>
<defs><marker id="fk-arrow-rail" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#6C7889"/></marker></defs>
<rect x="0.5" y="0.5" width="1199" height="934" rx="16" fill="#0E131A" stroke="#283241"/>
<text x="32" y="46.8" font-size="16" font-weight="700" letter-spacing="1.2" fill="#F8D27A">ARCHITECTURE</text>
<text x="32" y="85.6" font-size="32" font-weight="700" fill="#E8EDF3">The layers, one of them yours</text>
<text x="32" y="115.4" font-size="18" fill="#9AA6B5">Each arrow is a call. Only the port changes from one MCU to the next.</text>
<rect x="32" y="131.4" width="1136" height="1" fill="#252F3C"/>
<rect x="32" y="302.4" width="796" height="112.2" rx="16" fill="#2A2113" stroke="#6B5424" stroke-width="1.2"/>
<path d="M430 242.4 L430 298.4" fill="none" stroke="#6C7889" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#fk-arrow-rail)"/>
<path d="M430 418.6 L430 474.6" fill="none" stroke="#6C7889" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#fk-arrow-rail)"/>
<path d="M430 571.6 L430 627.6" fill="none" stroke="#6C7889" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#fk-arrow-rail)"/>
<path d="M430 723.6 L430 779.6" fill="none" stroke="#6C7889" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#fk-arrow-rail)"/>
<rect x="32" y="149.4" width="796" height="89" rx="12" fill="#0F2A28" stroke="#2BB3A3" stroke-width="1.4"/>
<rect x="32" y="157.4" width="4" height="73" rx="2" fill="#2BB3A3"/>
<rect x="32" y="478.6" width="796" height="89" rx="12" fill="#2A2113" stroke="#F4B942" stroke-width="1.4"/>
<rect x="32" y="486.6" width="4" height="73" rx="2" fill="#F4B942"/>
<rect x="32" y="631.6" width="796" height="88" rx="12" fill="#0F2A28" stroke="#2BB3A3" stroke-width="1.4"/>
<rect x="32" y="639.6" width="4" height="72" rx="2" fill="#2BB3A3"/>
<rect x="32" y="783.6" width="796" height="89" rx="12" fill="#1B232E" stroke="#94A3B8" stroke-width="1.4"/>
<rect x="32" y="791.6" width="4" height="73" rx="2" fill="#94A3B8"/>
<rect x="868" y="302.4" width="300" height="128.3" rx="12" fill="#2A2113" stroke="#6B5424" stroke-width="1"/>
<rect x="868" y="631.6" width="300" height="103.6" rx="12" fill="#0F2A28" stroke="#215A54" stroke-width="1"/>
<text x="56" y="184.4" font-size="20" font-weight="700" fill="#A7F3E6">Your application</text>
<text x="56" y="215" font-size="17" fill="#D2DAE4">a handler, a manager or a test</text>
<rect x="48" y="370.6" width="167" height="26" rx="13" fill="#2A2113" stroke="#6B5424" stroke-width="1"/>
<text x="56" y="388.7" font-size="16" font-weight="700" fill="#F8D27A">EnsureInitialized()</text>
<rect x="223" y="370.6" width="70.6" height="26" rx="13" fill="#2A2113" stroke="#6B5424" stroke-width="1"/>
<text x="231" y="388.7" font-size="16" font-weight="700" fill="#F8D27A">Read()</text>
<rect x="301.6" y="370.6" width="162.1" height="26" rx="13" fill="#2A2113" stroke="#6B5424" stroke-width="1"/>
<text x="309.6" y="388.7" font-size="16" font-weight="700" fill="#F8D27A">ReadResistance()</text>
<rect x="471.7" y="370.6" width="149.7" height="26" rx="13" fill="#2A2113" stroke="#6B5424" stroke-width="1"/>
<text x="479.7" y="388.7" font-size="16" font-weight="700" fill="#F8D27A">ReadRawCode()</text>
<rect x="629.4" y="370.6" width="111.8" height="26" rx="13" fill="#2A2113" stroke="#6B5424" stroke-width="1"/>
<text x="637.4" y="388.7" font-size="16" font-weight="700" fill="#F8D27A">SetConfig()</text>
<text x="48" y="331.4" font-size="17" font-weight="700" fill="#F8D27A">HARDWARE-AGNOSTIC CORE</text>
<text x="48" y="354.6" font-size="16" fill="#F8D27A">NtcThermistor, inc/ntc_thermistor.hpp</text>
<rect x="405.4" y="258.4" width="49.1" height="24" rx="12" fill="#0E131A"/>
<text x="430" y="276.2" font-size="16" font-weight="500" text-anchor="middle" fill="#9AA6B5">calls</text>
<text x="56" y="513.6" font-size="20" font-weight="700" fill="#F8D27A">Port contract</text>
<text x="56" y="544.2" font-size="17" fill="#D2DAE4">AdcInterface&lt;YourPort&gt;: checked at compile time, no virtual calls</text>
<text x="56" y="666.6" font-size="20" font-weight="700" fill="#A7F3E6">Your port</text>
<text x="56" y="695.8" font-size="16" font-family="'JetBrains Mono', 'SFMono-Regular', Menlo, Consolas, monospace" fill="#D2DAE4">EnsureInitialized()  ReadRaw()</text>
<text x="56" y="818.6" font-size="20" font-weight="700" fill="#E2E8F0">NtcThermistor</text>
<text x="56" y="849.2" font-size="17" fill="#D2DAE4">the divider and the thermistor, on the ADC input</text>
<rect x="341" y="434.6" width="178.1" height="24" rx="12" fill="#0E131A"/>
<text x="430" y="452.4" font-size="16" font-weight="500" text-anchor="middle" fill="#9AA6B5">conversion requests</text>
<rect x="329.6" y="587.6" width="200.8" height="24" rx="12" fill="#0E131A"/>
<text x="430" y="605.4" font-size="16" font-weight="500" text-anchor="middle" fill="#9AA6B5">forwards to your hooks</text>
<rect x="336.9" y="739.6" width="186.2" height="24" rx="12" fill="#0E131A"/>
<text x="430" y="757.4" font-size="16" font-weight="500" text-anchor="middle" fill="#9AA6B5">one raw code per call</text>
<text x="886" y="337.4" font-size="20" font-weight="700" fill="#F8D27A">Shared</text>
<text x="886" y="360.8" font-size="17" fill="#F8D27A">The core and the contract are</text>
<text x="886" y="385.5" font-size="17" fill="#F8D27A">the same code on every MCU</text>
<text x="886" y="410.1" font-size="17" fill="#F8D27A">and on the host.</text>
<text x="886" y="666.6" font-size="20" font-weight="700" fill="#A7F3E6">Yours</text>
<text x="886" y="690" font-size="17" fill="#A7F3E6">One small class per MCU or</text>
<text x="886" y="714.7" font-size="17" fill="#A7F3E6">board.</text>
<rect x="32" y="885" width="14" height="14" rx="4" fill="#0F2A28" stroke="#2BB3A3" stroke-width="1.4"/>
<text x="54" y="899.6" font-size="16" fill="#9AA6B5">you write</text>
<rect x="152.3" y="885" width="14" height="14" rx="4" fill="#2A2113" stroke="#F4B942" stroke-width="1.4"/>
<text x="174.3" y="899.6" font-size="16" fill="#9AA6B5">this library</text>
<rect x="282.1" y="885" width="14" height="14" rx="4" fill="#1B232E" stroke="#94A3B8" stroke-width="1.4"/>
<text x="304.1" y="899.6" font-size="16" fill="#9AA6B5">hardware</text>
<path d="M404.1 893L434.1 893" fill="none" stroke="#6C7889" stroke-width="2.2" marker-end="url(#fk-arrow-rail)"/>
<text x="448.1" y="899.6" font-size="16" fill="#9AA6B5">calls</text>
</svg>
